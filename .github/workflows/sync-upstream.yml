name: Sync Upstream

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Save pre-merge HEAD
        id: premerge
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/ColeSpringer/WaxSeal.git

      - name: Fetch upstream
        run: git fetch upstream --no-tags

      - name: Check for new upstream commits
        id: check
        run: |
          BEHIND=$(git rev-list HEAD..upstream/main --count)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "Upstream is $BEHIND commit(s) ahead"

      - name: Merge upstream/main
        if: steps.check.outputs.behind != '0'
        run: |
          git merge upstream/main \
            --no-edit \
            --strategy-option=ours \
            -m "chore: sync upstream ColeSpringer/WaxSeal"

      - name: Fix upstream import paths
        if: steps.check.outputs.behind != '0'
        run: |
          find . -name "*.go" -not -path "./.git/*" \
            -exec grep -l "github.com/colespringer" {} \; \
            | xargs -r sed -i 's|github.com/colespringer|github.com/festum|g'
          find . -name "go.mod" -not -path "./.git/*" \
            -exec sed -i 's|github.com/colespringer|github.com/festum|g' {} \;
          find . -name "go.sum" -not -path "./.git/*" \
            -exec sed -i 's|github.com/colespringer|github.com/festum|g' {} \;
          if ! git diff --quiet; then
            git add -A
            git commit -m "fix: rewrite upstream import paths colespringer→festum after sync"
          fi

      - name: Restore our workflows
        if: steps.check.outputs.behind != '0'
        run: |
          git checkout ${{ steps.premerge.outputs.sha }} -- .github/workflows/
          if ! git diff --cached --quiet; then
            git commit -m "fix: restore fork workflows after upstream merge"
          fi

      - name: Push to fork
        if: steps.check.outputs.behind != '0'
        run: git push origin main
